[package]
name = "only-brain"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/IgorFroehner/only-brain"
description = "A simple Neural Network library, without the learning part."
readme = "README.md"
keywords = ["neural-network", "neuroevolution", "machine-learning", "genetic-algorithm"]
categories = ["science", "algorithms"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.9.2"
nalgebra = "0.34"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.19"

[dev-dependencies]
# Writes models in the pre-0.3 format, to test that they still load.
bincode = "1.3.3"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
rand_distr = "0.5"
serde_json = "1.0"
